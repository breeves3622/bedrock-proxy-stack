version: "3.8"

services:
  # -------------------------------------------------------------------------
  # 1. Bedrock Proxy Service (BedrockConnect)
  #    Broadcasts on LAN UDP 19132 and serves the in-game server menu
  # -------------------------------------------------------------------------
  bedrock-proxy:
    image: pugmatt/bedrock-connect:latest
    container_name: bedrock-proxy
    restart: unless-stopped
    # On Linux/Portainer hosts: 'network_mode: host' enables local LAN broadcast
    # discovery so console/mobile/PC clients see the game in the Friends tab.
    network_mode: host
    environment:
      - BC_CUSTOM_SERVERS=/config/custom_servers.json
      - BC_USER_SERVERS=true
      - BC_SERVER_LIMIT=50
      - BC_DB_TYPE=none
      - BC_MOTD_1=§bMy Bedrock Proxy
      - BC_MOTD_2=§aSelect a server to play!
      - BC_KICK_INACTIVE=true
      - BC_ONLINE_MODE=true
    volumes:
      - ./config:/config
      - ./players:/players

  # -------------------------------------------------------------------------
  # 2. Web Management Dashboard
  #    Web interface to add/edit servers, test pings, view logs & restart proxy
  # -------------------------------------------------------------------------
  proxy-web-ui:
    build: ./web-ui
    container_name: bedrock-proxy-web
    restart: unless-stopped
    ports:
      - "8090:8080"
    environment:
      - PORT=8080
      - SERVERS_FILE=/config/custom_servers.json
      - TARGET_CONTAINER=bedrock-proxy
      - XBOX_CONTAINER=mcxboxbroadcast
      - XBOX_CONFIG_DIR=/xbox-config
      # Optional: set a password to protect the web dashboard (leave empty for none)
      - ADMIN_PASSWORD=
    volumes:
      # Mount config folder so web UI can read and write custom_servers.json
      - ./config:/config
      # Mount xbox config folder for broadcaster settings
      - ./xbox-config:/xbox-config
      # Mount Docker socket to allow status check, restart, and log streaming
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - bedrock-proxy

  # -------------------------------------------------------------------------
  # 3. Xbox Live Friend Broadcaster (MCXboxBroadcast)
  #    Broadcasts proxy as a joinable Xbox Live friend world (across internet & LAN)
  # -------------------------------------------------------------------------
  mcxboxbroadcast:
    image: ghcr.io/mcxboxbroadcast/standalone:latest
    container_name: mcxboxbroadcast
    restart: unless-stopped
    stdin_open: true
    tty: true
    volumes:
      - ./xbox-config:/opt/app/config
    depends_on:
      - bedrock-proxy
